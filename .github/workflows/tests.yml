name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q app.py notifications.py contributions.py sync_diagnostics.py local_backups.py phone_access.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node for UI logic tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: UI syntax and behaviour
        run: |
          node --check static/app.js
          node --check static/sync-status.js
          node --check static/contributions.js
          node --check static/mobile.js
          node --check static/phone-access.js
          node --check static/local-data.js
          node --check static/sw.js
          node --test tests/test_*_ui.js
  hosted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cloud.txt
      - run: python -m compileall -q cloud.py cloud_identity.py cloud_push.py
      - run: python -m unittest discover -s tests -v
      - name: Build hosted container
        run: docker build -t github-workdesk:test .
